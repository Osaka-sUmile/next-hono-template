language: "ja-JP"

reviews:
  poem: false
  collapse_walkthrough: false
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    base_branches:
      - develop
      - main

path_filters:
  - "!pnpm-lock.yaml"
  - "!.claude/**"
  - "!**/*.example"

instructions: |
  このリポジトリは yomutan プロジェクトのバックエンド（Express + TypeScript）と
  フロントエンド（Next.js）で構成されています。
  CLAUDE.md に定義された開発ガイドラインに従っているかを重点的に確認してください。

  ## アーキテクチャルール

  ### 実装レイヤー順序
  新機能追加時は以下の順序で実装されているか確認する：
  1. Domain (packages/domain): エンティティ・リポジトリインターフェース
  2. Database (packages/database): リポジトリ実装・クエリサービス
  3. Application (apps/api/src/application): ユースケース
  4. Presentation (apps/api/src/presentation): バリデーション・コントローラー

  ### CQRS
  - Command（副作用あり）と Query（参照のみ）のユースケースが混在していないか
  - Command は必要に応じて `prisma.$transaction` を使用しているか

  ### DTO / エラーの責務
  - Request DTO は Presentation 層で Zod から生成されているか
  - Response DTO は Application 層で組み立てられているか
  - エラークラスは `apps/api/src/application/errors/` に集約されているか

  ### エラーコード（重要）
  エラーコードを追加・変更している場合、以下の 3 箇所が同時に更新されているか必ず確認する：
  1. `apps/api/src/presentation/error-codes.ts` の ErrorCodes 定数
  2. `apps/api/src/presentation/error-codes.ts` の ErrorCode 型（union）
  3. `apps/api/docs/components/schemas/Error.yaml` の enum
  いずれか 1 箇所でも欠けている場合はレビューコメントで指摘する。
  また、エラーレスポンスのキー名は必ず `error` であること（`message` / `msg` は不可）。

  ### テスト配置
  - Vitest テストは実装ファイルと同じ階層に co-located されているか（`__tests__/` ディレクトリは不可）
  - E2E テストは `apps/web/tests/e2e/` に配置されているか
  - テスト共通ユーティリティは `<app>/src/test-utils/` に置き、独自の深い階層を作らないこと

  ### バリデーション境界
  - 入力バリデーションは Presentation 層（Zod）で行われているか
  - ビジネスロジックのバリデーションは Domain 層（エンティティメソッド内）で行われているか
  - Presentation 層でビジネスルールのバリデーションをしていないか

  ### Barrel Pattern
  - 外部パッケージからのインポートは `package.json` の公開エントリーポイント経由か
  - 深い階層を直接 import していないか（例: `@workspace/database/src/repositories/user` は不可）

  ### 環境変数
  - `process.env` を直接参照していないか
  - `apps/api/src/infrastructure/env.ts` の型付き `env` を使用しているか
  - 新しい環境変数は `env.ts` の Zod スキーマに追加されているか

path_instructions:
  - path: "packages/domain/**"
    instructions: |
      - エンティティにビジネスロジックが適切にカプセル化されているか
      - リポジトリインターフェースがドメイン用語で定義されているか（インフラ詳細が漏れていないか）
      - ファイル命名規則: *.entity.ts / *.repository.ts

  - path: "packages/database/**"
    instructions: |
      - Prisma の実装がドメインのリポジトリインターフェースを正しく実装しているか
      - ファイル命名規則: *.prisma-repository.ts / *.query-service.ts

  - path: "apps/api/src/application/**"
    instructions: |
      - Command と Query が適切に分離されているか
      - Command ユースケースで必要なトランザクション処理が行われているか
      - Response DTO がこの層で組み立てられているか（Presentation 層で組み立てていないか）

  - path: "apps/api/src/presentation/**"
    instructions: |
      - Zod による入力バリデーションが実装されているか
      - エラーは HTTP ステータスコードと ErrorCode に適切に変換されているか
      - エラーレスポンスのキー名が `error` であるか

  - path: "apps/api/src/presentation/error-codes.ts"
    instructions: |
      このファイルを変更している場合、以下も同時に変更されているか確認する：
      - ErrorCodes 定数オブジェクトへの追加
      - ErrorCode union 型への追加
      - apps/api/docs/components/schemas/Error.yaml の enum への追加

  - path: "apps/api/docs/components/schemas/Error.yaml"
    instructions: |
      enum の値が apps/api/src/presentation/error-codes.ts の ErrorCode 型・ErrorCodes 定数と完全に一致しているか確認する。

  - path: "**/*.test.ts"
    instructions: |
      - テストファイルが実装ファイルと同じ階層に配置されているか
      - 正常系・異常系のテストケースが網羅されているか
