services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: yomutan
    ports: ["5432:5432"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on: [db]
    ports: ["3000:3000"]
    env_file:
      - .env

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on: [api]
    ports: ["3001:3000"]
