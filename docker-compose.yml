services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["5432:5432"]
    # `docker compose up --wait` で接続可能になるまで待てるようにする (CI の test-db.yml で利用)。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 30

  # apps/api は Cloudflare Workers ランタイムに移行したため docker サービスとしては提供しない。
  # ローカル開発では wrangler dev (Neon serverless driver) がこの wsproxy 経由でローカル Postgres に接続する。
  neon-wsproxy:
    image: ghcr.io/neondatabase/wsproxy:latest
    environment:
      APPEND_PORT: "db:5432"
      ALLOW_ADDR_REGEX: ".*"
    ports: ["5433:80"]
    depends_on:
      db:
        condition: service_healthy
