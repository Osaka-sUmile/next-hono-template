get:
  summary: Get current user
  description: Returns the authenticated user's profile
  tags:
    - Users
  security:
    - cookieAuth: []
  responses:
    '200':
      description: Current user profile
      content:
        application/json:
          schema:
            $ref: '../components/schemas/User.yaml'
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Error.yaml'
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Error.yaml'
patch:
  summary: Update current user's profile
  description: Updates the authenticated user's display name
  tags:
    - Users
  security:
    - cookieAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - displayName
          properties:
            displayName:
              type: string
              nullable: true
              maxLength: 100
              description: New display name. Send null (or an empty string) to clear it.
  responses:
    '200':
      description: Updated profile
      content:
        application/json:
          schema:
            type: object
            required:
              - id
              - email
              - name
              - role
              - displayName
            properties:
              id:
                type: string
              email:
                type: string
                format: email
              name:
                type: string
              role:
                type: string
                enum: [user, admin]
              displayName:
                type: string
                nullable: true
    '400':
      description: >-
        Request validation failed (VALIDATION_ERROR). Returned when the request
        body is malformed JSON or fails schema validation (e.g. displayName is
        missing or exceeds the maximum length).
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Error.yaml'
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Error.yaml'
    '500':
      description: Unexpected internal server error (INTERNAL_ERROR).
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Error.yaml'
