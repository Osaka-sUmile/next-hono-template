openapi: 3.0.3
info:
  title: Yomutan API
  description: Yomutan backend API specification
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Local development server

paths:
  /health:
    $ref: './paths/health.yaml'
  /users:
    $ref: './paths/users.yaml'
  /auth/register:
    $ref: './paths/auth-register.yaml'
  /auth/login:
    $ref: './paths/auth-login.yaml'
  /auth/logout:
    $ref: './paths/auth-logout.yaml'
  /auth/refresh:
    $ref: './paths/auth-refresh.yaml'
  /auth/password-reset/request:
    $ref: './paths/auth-password-reset-request.yaml'
  /auth/password-reset/confirm:
    $ref: './paths/auth-password-reset-confirm.yaml'

components:
  schemas:
    Error:
      $ref: './components/schemas/Error.yaml'
    User:
      $ref: './components/schemas/User.yaml'
    AuthTokens:
      $ref: './components/schemas/AuthTokens.yaml'
    UserProfile:
      $ref: './components/schemas/UserProfile.yaml'
    RegisterRequest:
      $ref: './components/schemas/RegisterRequest.yaml'
    LoginRequest:
      $ref: './components/schemas/LoginRequest.yaml'
    PasswordResetRequest:
      $ref: './components/schemas/PasswordResetRequest.yaml'
    PasswordResetConfirmRequest:
      $ref: './components/schemas/PasswordResetConfirmRequest.yaml'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: refreshToken
