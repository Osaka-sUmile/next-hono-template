type: object
required:
  - error
  - code
properties:
  error:
    type: string
    description: Error message describing the issue
  code:
    type: string
    enum:
      - USER_NOT_FOUND       # User profile not found (404)
      - SESSION_INVALID      # Invalid or missing session token (401)
      - SESSION_EXPIRED      # Session expired or token revoked (401)
      - SESSION_FETCH_FAILED # Session retrieval failed (500)
      - FORBIDDEN            # Insufficient permissions (403)
      - RATE_LIMIT_EXCEEDED  # Too many requests (429)
      - VALIDATION_ERROR     # Request validation failed: malformed JSON or schema mismatch (400)
      - INTERNAL_ERROR       # Unexpected server error (500)
    description: Machine-readable error code for client-side handling. See enum comments for details.
