type: object
description: >
  Request body for authenticating an existing user. Currently identical to RegisterRequest,
  but kept separate as the two flows may evolve independently.
required:
  - email
  - password
properties:
  email:
    type: string
    format: email
    description: User email address
  password:
    type: string
    minLength: 8
    description: Password (minimum 8 characters)
