type: object
required:
  - id
  - email
  - name
  - role
  - emailVerified
  - createdAt
properties:
  id:
    type: string
    description: The user ID
  email:
    type: string
    format: email
    description: User email address
  name:
    type: string
    description: User full name
  role:
    type: string
    enum: [user, admin]
    description: User role
  displayName:
    type: string
    nullable: true
    description: User display name (user-settable)
  image:
    type: string
    nullable: true
    description: User avatar URL
  emailVerified:
    type: boolean
    description: Whether the email address has been verified
  createdAt:
    type: string
    format: date-time
