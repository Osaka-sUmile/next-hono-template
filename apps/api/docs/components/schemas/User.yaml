type: object
description: >
  Minimal user representation for authentication and system identification.
  Returned by auth endpoints (e.g. /auth/register).
  For display data (name, avatar) see UserProfile.
required:
  - id
  - email
  - createdAt
  - updatedAt
properties:
  id:
    type: string
    description: User ID
  email:
    type: string
    format: email
    description: User email address
  createdAt:
    type: string
    format: date-time
    description: ISO 8601 UTC timestamp of account creation
  updatedAt:
    type: string
    format: date-time
    description: ISO 8601 UTC timestamp of last account update
