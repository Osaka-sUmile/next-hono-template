type: object
required:
  - id
  - email
properties:
  id:
    type: string
    description: The user ID
  email:
    type: string
    format: email
    description: User email address
  name:
    type: string
    nullable: true
    description: User full name
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time
