type: object
description: >
  Request body for new account creation. Creates the minimal auth identity (User).
  Display data (name, avatar) is managed separately via the profile endpoint.
  May diverge from LoginRequest in the future (e.g. confirmPassword).
required:
  - email
  - password
properties:
  email:
    type: string
    format: email
    description: User email address
  password:
    type: string
    minLength: 8
    description: Password (minimum 8 characters)
