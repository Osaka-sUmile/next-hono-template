name: Setup pnpm workspace
description: pnpm / Node.js のセットアップと依存関係のインストール (actions/checkout の後に呼ぶこと)

runs:
  using: composite
  steps:
    # pnpm のバージョンはルート package.json の packageManager フィールドから解決される。
    - name: Install pnpm
      uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '20'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
