name: Setup pnpm workspace
description: pnpm / Node.js のセットアップと依存関係のインストール (actions/checkout の後に呼ぶこと)

runs:
  using: composite
  steps:
    # pnpm のバージョンはルート package.json の packageManager フィールドから解決される。
    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '26'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
