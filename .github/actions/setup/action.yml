name: Setup pnpm workspace
description: pnpm / Node.js のセットアップと依存関係のインストール (actions/checkout の後に呼ぶこと)

runs:
  using: composite
  steps:
    # pnpm のバージョンはルート package.json の packageManager フィールドから解決される。
    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
