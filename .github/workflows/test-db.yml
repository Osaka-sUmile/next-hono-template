name: DB Integration Tests

# packages/database は実 DB への結合テストが標準 (層別テスト戦略)。
# docker compose の Postgres + wsproxy を CI 内で起動し、ローカル開発と同一構成で検証する。
# turbo test (= pnpm test) には載せていないため、この job が DB 層のテストを担保する。
on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  db-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm workspace
        uses: ./.github/actions/setup

      # @workspace/domain は dist (ビルド出力) を公開エントリにするため、
      # 結合テストが @workspace/domain を解決できるよう依存パッケージを先にビルドする
      # (build タスクの dependsOn により //#db:generate → prisma generate も先行実行される)。
      - name: Build workspace dependencies
        run: pnpm exec turbo run build --filter=@workspace/database^...

      - name: Prepare env files
        run: |
          cp .env.example .env
          cp packages/database/.env.example packages/database/.env

      # --wait は db サービスの healthcheck (docker-compose.yml) が healthy になるまで待つ。
      - name: Start Postgres + wsproxy
        run: docker compose up -d --wait db neon-wsproxy

      - name: Apply migrations
        run: pnpm --filter @workspace/database db:migrate:deploy

      - name: Run DB integration tests
        run: pnpm --filter @workspace/database test:integration
