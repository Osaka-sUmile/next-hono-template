name: Lint

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup pnpm workspace
        uses: ./.github/actions/setup

      - name: Run Typecheck
        run: pnpm run typecheck

      - name: Run Lint
        run: pnpm run lint

      - name: Verify generated OpenAPI document and API types are up to date
        run: |
          echo "If this step fails, run 'pnpm run openapi:generate' locally and commit the resulting diff in apps/api/openapi.json and apps/web/lib/api-schema.d.ts."
          pnpm run openapi:generate
          git diff --exit-code -- apps/api/openapi.json apps/web/lib/api-schema.d.ts
