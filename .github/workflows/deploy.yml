name: Deploy

# develop への push → preview 環境、main への push → production 環境へデプロイする。
# workflow_dispatch で任意の環境を手動デプロイすることもできる (production へは main からのみ)。
# セットアップ手順 (GitHub Environments / Secrets / Variables / wrangler secret) は
# docs/deployment.md の「CI からの自動デプロイ」を参照。
on:
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy target"
        type: choice
        options: [preview, production]
        required: true

# どのジョブもリポジトリへの書き込みは行わないため、最小権限に絞る。
permissions:
  contents: read

# 同一環境へのデプロイは直列化する。デプロイ途中のキャンセルは中途半端な状態を生むため
# cancel-in-progress は無効にし、キューイングで処理する。
concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'production' || 'preview') }}
  cancel-in-progress: false

jobs:
  # ブランチ / 手動入力から環境名を解決する。
  # jobs.<id>.environment は env コンテキストを参照できないため outputs で受け渡す。
  resolve:
    runs-on: ubuntu-latest
    # ハングすると concurrency group の後続デプロイが無期限に詰まるため、全ジョブでタイムアウトを設定する。
    timeout-minutes: 5
    outputs:
      environment: ${{ steps.env.outputs.environment }}
    steps:
      - id: env
        # github コンテキストの値はシェルへ直接展開せず、スクリプトインジェクション対策として
        # env 経由でシェル変数として参照する。
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # 未マージのコードが本番へ出るのを防ぐため、production へのデプロイは main からのみ許可する。
            # GitHub Environments 側の Deployment branches 保護と二段構え (docs/deployment.md 参照)。
            if [ "$INPUT_ENVIRONMENT" = "production" ] && [ "$REF_NAME" != "main" ]; then
              echo "::error::production へは main ブランチからのみデプロイできます (現在のブランチ: $REF_NAME)"
              exit 1
            fi
            echo "environment=$INPUT_ENVIRONMENT" >> "$GITHUB_OUTPUT"
          elif [ "$REF_NAME" = "main" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
          else
            echo "environment=preview" >> "$GITHUB_OUTPUT"
          fi

  # デプロイ前チェック: typecheck / test / api・web の dry-run ビルド。
  # web のビルドが壊れている場合に migrate / deploy-api だけ先行して不整合になるのを防ぐため、
  # web もここでビルド検証する。
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm workspace
        uses: ./.github/actions/setup

      - name: Run Typecheck
        run: pnpm run typecheck

      - name: Run Tests
        run: pnpm run test

      - name: API dry-run build
        run: pnpm --filter api run build

      - name: Web dry-run build
        run: pnpm --filter web exec opennextjs-cloudflare build
        env:
          # ビルド検証用のダミー値。実際の値は deploy-web ジョブで環境ごとに注入される
          # (NEXT_PUBLIC_API_URL は未設定だと next build が失敗するため必須)。
          NEXT_PUBLIC_API_URL: "https://api.example.com"

  # DB マイグレーション。DATABASE_URL は Environment Secret で、Neon の direct (non-pooled)
  # 接続文字列を設定すること (prisma CLI は TCP 直結のため。docs/deployment.md 参照)。
  # prisma.config.ts の dotenv は既存の process.env を上書きしないため、ここで渡した値が優先される。
  #
  # このジョブの成功後に deploy-api が失敗すると「新スキーマ + 旧コード」の状態で止まるため、
  # マイグレーションは後方互換 (expand-contract) を前提とする。復旧は失敗ジョブの re-run でよい
  # (適用済みマイグレーションは migrate deploy が冪等にスキップする)。docs/deployment.md の「運用」参照。
  migrate:
    needs: [resolve, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ needs.resolve.outputs.environment }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm workspace
        uses: ./.github/actions/setup

      - name: Run Prisma migrations
        run: pnpm --filter @workspace/database db:migrate:deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # API のデプロイ。CLOUDFLARE_ENV は wrangler が --env 未指定時に参照するフォールバックで、
  # wrangler.jsonc の env.preview / env.production を選択する。
  # API_BASE_URL / WEB_BASE_URL は GitHub Environment Variables を唯一のソースとし、
  # `wrangler deploy --var` で注入する (wrangler.jsonc の各 env には定義しない)。
  # 値が wrangler.jsonc / GitHub Variables の複数箇所に分散すると同期漏れで CORS エラー等を
  # 起こすため、環境ごとの実 URL は GitHub 側に一元化する (docs/deployment.md 参照)。
  deploy-api:
    needs: [resolve, migrate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ needs.resolve.outputs.environment }}
    env:
      CLOUDFLARE_ENV: ${{ needs.resolve.outputs.environment }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      WEB_BASE_URL: ${{ vars.WEB_BASE_URL }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      # 未設定のままデプロイすると env.ts の Zod default (localhost) が使われ、
      # CORS / better-auth の origin 検証が全リクエストを拒否する状態で公開されてしまうため、
      # デプロイ前に失敗させる。
      - name: Ensure deploy URLs are configured
        run: |
          if [ -z "$API_BASE_URL" ] || [ -z "$WEB_BASE_URL" ]; then
            echo "::error::GitHub Environment Variables の API_BASE_URL / WEB_BASE_URL が未設定です。Settings → Environments → ${{ needs.resolve.outputs.environment }} の Variables に登録してください (docs/deployment.md 参照)"
            exit 1
          fi

      - name: Setup pnpm workspace
        uses: ./.github/actions/setup

      # wrangler が @workspace/* を TS ソースからバンドルする際、依存パッケージの dist と
      # Prisma Client (.prisma/client) が必要なため、turbo 経由で依存のみ事前ビルドする
      # (build タスクの dependsOn により //#db:generate → prisma generate が先行実行される)。
      - name: Build workspace dependencies
        run: pnpm exec turbo run build --filter=api^...

      - name: Deploy API to Cloudflare Workers
        run: >-
          pnpm --filter api run deploy
          --var "API_BASE_URL:${API_BASE_URL}"
          --var "WEB_BASE_URL:${WEB_BASE_URL}"

  # Web のデプロイ。新しい web が新しい API に依存するケースを安全側に倒すため API の後に実行する。
  # NEXT_PUBLIC_* はビルド時にクライアントバンドルへインラインされるため、GitHub Environment
  # Variables からビルドプロセスの環境変数として注入する (wrangler.jsonc の vars では不足)。
  # サーバー側ランタイム (instrumentation.ts 等が process.env を実行時参照する分) へは
  # deploy-api と同様に `--var` で同じ値を注入し、GitHub Variables を唯一のソースとする。
  # CLOUDFLARE_ENV は OpenNext が spawn する wrangler にそのまま伝播する。
  deploy-web:
    needs: [resolve, deploy-api]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ needs.resolve.outputs.environment }}
    env:
      CLOUDFLARE_ENV: ${{ needs.resolve.outputs.environment }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
      # Sentry の environment タグ用。preview / production はどちらも NODE_ENV=production で
      # ビルドされるため、デプロイ先環境名をビルド時に注入して区別する (GitHub Variables 不要)。
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${{ needs.resolve.outputs.environment }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm workspace
        uses: ./.github/actions/setup

      # next build が @workspace/auth (→ @workspace/database) の dist と Prisma Client に
      # 依存するため、deploy-api と同様に依存のみ事前ビルドする。
      - name: Build workspace dependencies
        run: pnpm exec turbo run build --filter=web^...

      # opennextjs-cloudflare deploy は未知のフラグをそのまま wrangler へパススルーする。
      # NEXT_PUBLIC_SENTRY_DSN は空文字運用 (Sentry 無効) がありうるため、非空のときだけ渡す。
      - name: Deploy Web to Cloudflare Workers
        run: |
          extra_vars=(--var "NEXT_PUBLIC_API_URL:${NEXT_PUBLIC_API_URL}")
          if [ -n "$NEXT_PUBLIC_SENTRY_DSN" ]; then
            extra_vars+=(--var "NEXT_PUBLIC_SENTRY_DSN:${NEXT_PUBLIC_SENTRY_DSN}")
          fi
          pnpm --filter web run deploy "${extra_vars[@]}"
