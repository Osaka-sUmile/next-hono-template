# Codex CLI による PR 自動レビュー（CodeRabbit と併用）。
# 実装担当 AI とは別モデルにレビューさせ、自己レビューの見落としを減らす。
# レビュー結果はトップレベルの PR レビューコメント（event=COMMENT）として投稿する。
#
# 必要な Repository Secret:
#   OPENAI_API_KEY — OpenAI API キー（Codex CLI 認証）
#
# 手動再実行: Actions → Codex review → Run workflow → PR 番号を指定

name: Codex review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

env:
  CODEX_VERSION: "0.146.0"
  CODEX_MODEL: "codex-auto-review"

concurrency:
  group: codex-review-pr-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  codex-review:
    # Dependabot PR には Secrets が渡らないためスキップ。
    # 外部 fork からの PR も Secrets を渡せないためスキップ。
    if: >-
      github.actor != 'dependabot[bot]' &&
      (
        github.event_name == 'workflow_dispatch' ||
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve PR metadata
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          set -euo pipefail
          META=$(gh pr view "$PR_NUMBER" --json headRefOid,baseRefName,title,number)
          echo "head_sha=$(echo "$META" | jq -r .headRefOid)" >> "$GITHUB_OUTPUT"
          echo "base_ref=$(echo "$META" | jq -r .baseRefName)" >> "$GITHUB_OUTPUT"
          echo "title=$(echo "$META" | jq -r .title)" >> "$GITHUB_OUTPUT"
          echo "number=$(echo "$META" | jq -r .number)" >> "$GITHUB_OUTPUT"

      - name: Skip if Codex review already exists for this commit
        id: skip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          MARKER="Reviewed commit: ${HEAD_SHA}"
          COUNT=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" --paginate \
            --jq "[.[] | select(.body != null and (.body | contains(\"## Codex Review\")) and (.body | contains(\"${MARKER}\")))] | length")
          if [ "$COUNT" -gt 0 ]; then
            echo "Codex review for ${HEAD_SHA} already exists on PR #${PR_NUMBER}. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        if: steps.skip.outputs.skip != 'true'
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch base branch for diff
        if: steps.skip.outputs.skip != 'true'
        run: git fetch origin "${{ steps.pr.outputs.base_ref }}"

      - name: Use Node.js
        if: steps.skip.outputs.skip != 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Cache global npm tarballs
        if: steps.skip.outputs.skip != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: codex-cli-${{ env.CODEX_VERSION }}-node22
          restore-keys: |
            codex-cli-${{ env.CODEX_VERSION }}-

      - name: Install Codex CLI (pinned)
        if: steps.skip.outputs.skip != 'true'
        run: npm install -g "@openai/codex@${CODEX_VERSION}"

      - name: Run Codex review
        if: steps.skip.outputs.skip != 'true'
        id: codex
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          export PR_NUMBER PR_TITLE BASE_REF HEAD_SHA
          envsubst '${PR_NUMBER} ${PR_TITLE} ${BASE_REF} ${HEAD_SHA}' \
            < .github/prompts/codex-review.md > /tmp/codex-review-prompt.md

          # workspace-write サンドボックスは GHA runner で bwrap が失敗するため danger-full-access を使用。
          codex exec review \
            --sandbox danger-full-access \
            --base "origin/${BASE_REF}" \
            --title "${PR_TITLE}" \
            --model "${CODEX_MODEL}" \
            --color never \
            --ephemeral \
            --ignore-user-config \
            --output-last-message codex-review-output.md \
            "$(cat /tmp/codex-review-prompt.md)"

      - name: Validate Codex output
        if: steps.skip.outputs.skip != 'true'
        run: |
          set -euo pipefail
          OUTPUT="codex-review-output.md"
          if [ ! -s "$OUTPUT" ]; then
            echo "Codex review output is empty."
            exit 1
          fi
          if ! grep -qE '^CODEX VERDICT: (LGTM|CHANGES REQUESTED)$' "$OUTPUT"; then
            echo "Missing or invalid CODEX VERDICT marker."
            echo "--- output tail ---"
            tail -30 "$OUTPUT"
            exit 1
          fi
          if grep -q '^CODEX VERDICT: CHANGES REQUESTED$' "$OUTPUT"; then
            echo "Codex requested changes (workflow continues)."
          else
            echo "Codex verdict: LGTM"
          fi

      - name: Post PR review comment
        if: steps.skip.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          jq -n \
            --rawfile body codex-review-output.md \
            --arg commit_id "$HEAD_SHA" \
            '{event: "COMMENT", commit_id: $commit_id, body: $body}' | \
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" --input -
