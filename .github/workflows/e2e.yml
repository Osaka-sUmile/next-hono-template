name: E2E Tests

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup pnpm workspace
        uses: ./.github/actions/setup

      # next build は @workspace/auth (→ @workspace/database) の dist と Prisma Client に
      # 依存する。クリーンな CI では未生成のため、依存パッケージのみ事前ビルドする
      # (build タスクの dependsOn により //#db:generate → prisma generate も先行実行される)。
      - name: Build workspace dependencies
        run: pnpm exec turbo run build --filter=web^...

      - name: Build Web App
        # NEXT_PUBLIC_API_URL は build 時にインライン化され、未設定だと
        # auth-client が throw してビルドが失敗する。e2e では /api/auth/* を
        # route interception でモックするため、実際に到達しないダミー値でよい。
        # NEXT_PUBLIC_TURNSTILE_SITE_KEY も同様に未設定だと turnstile-widget が throw する。
        # Cloudflare の公式テストサイトキー(常にチャレンジが自動成功する)を使う。
        run: cd apps/web && pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8787
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"

      - name: Install Playwright Browsers
        run: cd apps/web && pnpm exec playwright install --with-deps

      - name: Run Playwright tests
        run: cd apps/web && pnpm exec playwright test

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
