name: E2E Tests

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web App
        # NEXT_PUBLIC_API_URL は build 時にインライン化され、未設定だと
        # auth-client が throw してビルドが失敗する。e2e では /api/auth/* を
        # route interception でモックするため、実際に到達しないダミー値でよい。
        run: cd apps/web && pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8787

      - name: Install Playwright Browsers
        run: cd apps/web && pnpm exec playwright install --with-deps

      - name: Run Playwright tests
        run: cd apps/web && pnpm exec playwright test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
